<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Advanced Search</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .header { color: #d93025; font-size: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 200px; font-size: 14px; }
        input[type="text"] { width: 300px; padding: 6px; border: 1px solid #ccc; }
        input[type="submit"] { background-color: #4d90fe; color: white; border: none; padding: 8px 16px; border-radius: 2px; font-weight: bold; cursor: pointer; }
        .links { position: absolute; top: 20px; right: 20px; }
        .links a { color: #000; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="links">
        <a href="index.html">Google Search</a>
    </div>
    <div class="header">Advanced Search</div>
    <form action="https://google.com/search">
        <div class="form-group">
            <label>all these words:</label>
            <input type="text" name="q">
        </div>
        <div class="form-group">
            <label>this exact word or phrase:</label>
            <input type="text" name="as_epq">
        </div>
        <div class="form-group">
            <label>any of these words:</label>
            <input type="text" name="as_oq">
        </div>
        <div class="form-group">
            <label>none of these words:</label>
            <input type="text" name="as_eq">
        </div>
        <input type="submit" value="Advanced Search">
    </form>
</body>
</html>
